baseURL = "http://localhost:1313/"
languageCode = "zh-cn"
title = "我的博客"
theme = "PaperMod"

[params]
  env = "production"
  description = "我的个人博客"
  author = "你的名字"

  defaultTheme = "auto"
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = "你好 👋"
    Content = "欢迎来到我的个人博客。"

